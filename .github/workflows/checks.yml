name: Checks

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check src tests

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate localization JSON
        run: python -m json.tool src/i18n/messages.json > /dev/null

      - name: Run unit tests
        env:
          BOT_TOKEN: test-token
        run: python -m unittest discover -s tests -v

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

  container:
    name: Build container
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tntu-schedule:check
          cache-from: type=gha,scope=checks
          cache-to: type=gha,mode=max,scope=checks
